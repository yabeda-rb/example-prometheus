x-app-service-template: &app
  build: rails_app
  image: yabeda-rails-app:1.0
  volumes:
    - ./rails_app:/app
  environment: &app-environment
    REDIS_URL: redis://redis:6379/0
    RAILS_HOST: ${RAILS_HOST:-rails}

services:
  rails:
    <<: *app
    ports:
      - 127.0.0.1:${RAILS_PORT:-5000}:5000
    stdin_open: true
    tty: true
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://localhost:5000/up"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 60s
      start_interval: 1s

    command: bundle exec puma -C config/puma.rb

  sidekiq:
    <<: *app
    ports:
      - 127.0.0.1:5100:5100
    environment:
      <<: *app-environment
      PORT: 5100
    depends_on:
      redis:
        condition: service_healthy

    command: bundle exec sidekiq -C config/sidekiq.yml

  redis:
    image: redis:8-alpine
    command: redis-server
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
      start_interval: 1s

  grafana:
    image: grafana/grafana:10.2.2
    depends_on:
      - prometheus
    ports:
      - 127.0.0.1:3000:3000/tcp
    volumes: 
      - ./grafana_db:/var/lib/grafana
    user: "0"

  prometheus:
    image: prom/prometheus:v2.48.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - 127.0.0.1:9090:9090/tcp
    depends_on:
      - rails
    command:
      - --config.file=/etc/prometheus/prometheus.yml

  rails_stressor:
    build: rails_stressor
    image: rails_stressor
    depends_on:
      rails:
        condition: service_healthy
    command: -z 2m -c 15 -m GET http://rails:5000
